        value. Groups are sorted by volume, largest first, and at most
        `limit` are kept. The `time` and `direction` parameters are
        validated but do not change the answer. The bounds are widened to
        whole milliseconds and both are inclusive. The `stats` object is
        always zero. Read pipelines do not apply.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/QVolumeSelector'
        - $ref: '#/components/parameters/QStart'
        - $ref: '#/components/parameters/QEnd'
        - $ref: '#/components/parameters/QSince'
        - $ref: '#/components/parameters/QTime'
        - $ref: '#/components/parameters/QVolumeLimit'
        - $ref: '#/components/parameters/QDirection'
        - $ref: '#/components/parameters/QAggregateBy'
        - $ref: '#/components/parameters/QTargetLabels'
      responses:
        '200':
          description: The volume per group, as a vector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QVolumeResponse'
        '400':
          $ref: '#/components/responses/LokiError'
          description: >-
            `query` is missing or does not parse, `limit` is negative or not
            an integer, `aggregateBy` is not `series` or `labels`, end is
            before start, or `time`, `direction`, start, end or since is
            invalid.
        '401':
          $ref: '#/components/responses/LokiError'
          description: The X-Scope-OrgID header names an invalid or disallowed tenant.
        '499':
          $ref: '#/components/responses/QClientClosed'
        '500':
          $ref: '#/components/responses/LokiError'
          description: The read failed on the server.
        '501':
          $ref: '#/components/responses/LokiError'
          description: This process does not run the querier role.
        '503':
          $ref: '#/components/responses/QShuttingDown'
        '504':
          $ref: '#/components/responses/QTimeout'

  /loki/api/v1/index/volume_range:
    get:
      operationId: indexVolumeRange
      tags: [Metadata]
      summary: Sum line bytes per group in step buckets
      description: >-
        Same grouping as `/loki/api/v1/index/volume`, bucketed by `step`. The
        answer is a matrix when any group has more than one bucket, and a
        vector when every group has a single bucket. The step is truncated to
