# Parkana HTTP API. Every route the all-in-one process registers is here,
# and cmd/parkana/routes_test.go fails when this file and the registered
# routes drift apart.
openapi: 3.1.0
info:
  title: Parkana HTTP API
  version: 1.2.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Parkana serves every route from one HTTP server; `-roles` decides which
    handlers are real in a process. A Loki route whose role does not run in the
    process answers 501. The Parkana routes (`/api/v1/sql`, `/api/v1/pipelines`,
    `/internal/ingest/tail`) are not registered without their role and answer
    404.

    Every request passes the tenant middleware first (see the `X-Scope-OrgID`
    parameter). Errors are one line of plain text, as Loki writes them. A path
    no route serves answers 404 and a method a path does not serve answers 405,
    both with the plain-text bodies of Go's `http.ServeMux`. A GET route also
    answers HEAD. A handler panic answers 500 with the body `internal error`.
servers:
  - url: http://localhost:3100
tags:
  - name: Push
    description: Write log entries, in the Loki push format or as OTLP logs.
  - name: Query
    description: Run LogQL queries, instant or over a time range.
  - name: Metadata
    description: List labels, label values and series, and read index statistics and volumes.
  - name: Tail
    description: Stream new entries over a WebSocket as they arrive.
  - name: SQL
    description: Run sandboxed read-only SQL over stored log rows.
  - name: Pipelines
    description: Manage ingest and read pipelines, and dry-run a candidate.
  - name: Operations
    description: Readiness, Prometheus metrics and build information.
  - name: Internal
    description: Routes between Parkana roles. They are not a public API.
paths:
  /ready:
    get:
      operationId: ready
      tags: [Operations]
      summary: Report whether the process is ready
      description: |
        Answers 200 with the body `ready` once the HTTP server is serving and
        every registered readiness check passes. The ingester registers the
        `ingest` check, which fails while the ingester replays its WAL, while
        it shuts down and after a fatal error. Use it as a readiness probe,
        not a liveness probe.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The process is ready. The body is `ready` and a newline.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
              example: "ready\n"
        '401':
          $ref: '#/components/responses/LokiError'
          description: The `X-Scope-OrgID` header names an invalid or disallowed tenant.
        '503':
          $ref: '#/components/responses/LokiError'
          description: |
            The server is not serving yet (`not serving yet`), or a readiness
            check failed. The body then names the check and its error, as in
            `ingest: ingest: replaying WAL or shutting down` or
            `ingest: ingest: failed`.
  /metrics:
    get:
      operationId: metrics
      tags: [Operations]
      summary: Expose Prometheus metrics
      description: |
        Serves every registered collector in the Prometheus exposition format:
        the metrics listed in the operations guide plus the Go runtime (`go_`)
        and process (`process_`) collectors. The format follows the
        scraper's `Accept` header, as the Prometheus client library negotiates it;
        without one it is the text format shown here.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The metrics.
          content:
            text/plain; version=0.0.4; charset=utf-8; escaping=underscores:
              schema:
                type: string
              example: |
                # HELP parkana_http_requests_total HTTP requests by route pattern and status code.
                # TYPE parkana_http_requests_total counter
                parkana_http_requests_total{code="200",route="GET /ready"} 1
        '401':
          $ref: '#/components/responses/LokiError'
          description: The `X-Scope-OrgID` header names an invalid or disallowed tenant.
  /loki/api/v1/status/buildinfo:
    get:
      operationId: buildInfo
      tags: [Operations]
      summary: Report build information in Loki's format
      description: |
        Returns Loki's buildinfo object. Grafana probes this route and enables
        features by `version`, so `version` is the Loki version Parkana is
        compatible with, not Parkana's own. Parkana's version is in
        `parkanaVersion`. Every process serves this route, whatever its roles.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The build information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
        '401':
          $ref: '#/components/responses/LokiError'
          description: The `X-Scope-OrgID` header names an invalid or disallowed tenant.

  /loki/api/v1/push:
    post:
      operationId: pushLogs
      summary: Push log entries in the Loki format
      tags: [Push]
      description: |
        Accepts a Loki push request, validates the whole request, applies the ingest
        pipelines and records the entries for the tenant. The ingester answers 204 only
        after the configured acknowledgment point: in `-wal.sync` always mode after the
        WAL record is fsynced and admitted to the memtable, in interval mode after the
        WAL write and memtable admission. Any validation error rejects the whole
        request; nothing from a rejected request is stored.

        **Body formats.** The server picks the decoder from the media type of
        `Content-Type` (parameters such as `charset` are ignored):

        - `application/json` is the Loki JSON push format.
        - Every other parseable media type, normally `application/x-protobuf`, is a
          `logproto.PushRequest` protobuf message compressed with the snappy block
          format (not the framed format). The body is always snappy-decoded on this
          path, whatever `Content-Encoding` says.
        - A missing or unparseable `Content-Type` returns 400.

        **Content encodings.** `Content-Encoding` may be empty, `identity`, `snappy`
        or `gzip` (exact, case-sensitive values). `gzip` is expanded before the body
        is decoded, so a gzip-wrapped snappy protobuf body and gzip JSON both work.
        `snappy` is accepted only as a label for the protobuf snappy block that the
        protobuf path always decodes; it does not decompress a JSON body. Any other
        value, including lists such as `gzip, snappy`, returns 400.

        **Limits.** `-ingest.max-request-size` (default 16 MiB,
        `PARKANA_INGEST_MAX_REQUEST_SIZE`) bounds the received body, the
        gzip-expanded body and the snappy-decoded message separately; exceeding any
        of them returns 400, not 413. `-ingest.max-line-size` (default 256 KiB,
        `PARKANA_INGEST_MAX_LINE_SIZE`) bounds the byte length of every log line.
        There is no separate count or size limit for labels or structured metadata
        beyond the request size.

        **Labels and structured metadata.** Label and metadata names must match
        `[a-zA-Z_][a-zA-Z0-9_]*` and be unique within their set. Values can be any
        string, including the empty string. An empty stream label set `{}` is
        accepted. In protobuf bodies the stream labels are a selector string such as
        `{job="api", host="web-1.example.com"}` that allows only the `=` operator;
        values are double-quoted with Go escapes or backquoted raw strings.

        **Timestamps.** JSON timestamps are strings holding Unix nanoseconds, or RFC
        3339 with an optional fraction. Protobuf timestamps are
        `google.protobuf.Timestamp` values between year 1 and year 9999, and every
        entry must carry one. Old, future and out-of-order timestamps are not
        rejected. Storage keeps microsecond precision, so nanoseconds are truncated.

        **Empty requests.** As in Loki, a request without streams (`{"streams":[]}`,
        `{}` or a protobuf message with no streams) answers 422 (new in 1.2.0). A
        request whose streams carry no entries, as sent or after the ingest pipelines
        run, answers 204, and nothing is stored or written to the WAL. The labels of
        streams without entries are still validated, so invalid ones answer 400.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: Content-Encoding
          in: header
          required: false
          description: |
            Optional body encoding: empty, `identity`, `snappy` or `gzip`. `snappy`
            changes nothing; the protobuf body is always a snappy block. Any other
            value returns 400.
          schema:
            type: string
            enum: [identity, snappy, gzip]
      requestBody:
        required: true
        description: |
          A Loki push request. Use `application/json` for the JSON format. Any other
          parseable media type is decoded as a snappy block-compressed protobuf
          message.
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/PushRequestProtobuf'
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequestJSON'
            example:
              streams:
                - stream:
                    job: api
                    host: web-1.example.com
                  values:
                    - ["1700000000000000000", "GET /index.html 200"]
                    - ["1700000000500000000", "GET /missing 404", {trace_id: "0af7651916cd43dd8448eb211c80319c"}]
      responses:
        '204':
          description: The push was accepted and reached the acknowledgment point. The body is empty.
        '400':
          $ref: '#/components/responses/LokiError'
          description: |
            The request was rejected and nothing was stored. Causes: missing or
            unparseable `Content-Type`; unsupported `Content-Encoding`; a body,
            gzip expansion or snappy expansion larger than
            `-ingest.max-request-size`; an error while reading the body; malformed
            gzip, snappy, protobuf or JSON data (including duplicate JSON member
            names); a JSON value tuple that is not 2 or
            3 elements, a non-string timestamp or line, a null label value or a
            metadata element that is not an object; a timestamp that is neither
            nanoseconds nor RFC 3339, or a protobuf timestamp that is missing or out
            of range; an invalid or duplicate label or structured metadata name; a protobuf label string that is not a `=`-only selector; a line
            longer than `-ingest.max-line-size`; an ingest pipeline that rejected
            the data; or a pipeline result that fails the same validation
            (message prefixed `ingest: transformed push is invalid:`).
        '401':
          $ref: '#/components/responses/LokiError'
          description: |
            The `X-Scope-OrgID` header could not be resolved to a tenant. The tenant
            middleware writes this with `http.Error`, which produces the same
            `text/plain; charset=utf-8` one-line body.
        '422':
          $ref: '#/components/responses/LokiError'
          description: |
            The request has no streams (new in 1.2.0). The body is Loki's
            `error at least one valid stream is required for ingestion`. Nothing is
            stored.
        '429':
          $ref: '#/components/responses/Backpressure'
        '500':
          $ref: '#/components/responses/LokiError'
          description: |
            A server fault. The body is `ingest: push transform failed` when an
            ingest pipeline failed for a reason other than the data, or
            `ingest: failed to persist push` when the WAL or memtable could not
            record the request.
        '501':
          $ref: '#/components/responses/LokiError'
          description: This process does not run the ingester role, so the route is a placeholder.
        '503':
          $ref: '#/components/responses/LokiError'
          description: |
            The ingester is not accepting pushes: it is still replaying its WAL, it
            is shutting down, it has stopped after a fatal error, or the shutdown
            deadline expired while the push waited for its acknowledgment. The body
            is `ingest: not accepting pushes`. Retry later.

  /v1/logs:
    post:
      operationId: pushOTLPLogs
      summary: Push logs in the OTLP/HTTP format
      tags: [Push]
      description: |
        Accepts an OpenTelemetry `ExportLogsServiceRequest` over OTLP/HTTP and stores
        it through the same validation, limits, ingest pipelines and acknowledgment
        path as `POST /loki/api/v1/push`. The conversion follows Loki 3.7.9 with
        its default OTLP settings, which cannot be configured here.

        **Body formats.** `Content-Type` must have the media type
        `application/x-protobuf` (binary protobuf) or `application/json` (OTLP
        JSON); parameters such as `charset` are ignored. Any other media type,
        including `application/protobuf`, or a missing `Content-Type`, returns
        400. Unlike the Loki push endpoint, the body is never snappy-compressed.

        **Content encodings.** `Content-Encoding` may be empty, `identity` or
        `gzip`. Any other value, including `snappy`, `zstd`, `lz4` and `deflate`,
        returns 400.

        **Limits.** `-ingest.max-request-size` (default 16 MiB) bounds the received
        body and the gzip-expanded body. `-ingest.max-line-size` (default 256 KiB)
        bounds each log line.

        **Mapping.**

        - These resource attributes become stream labels, with names normalized
          (for example `service.name` becomes `service_name`): `service.name`,
          `service.namespace`, `service.instance.id`, `deployment.environment`,
          `deployment.environment.name`, `cloud.region`,
          `cloud.availability_zone`, `k8s.cluster.name`, `k8s.namespace.name`,
          `k8s.pod.name`, `k8s.container.name`, `container.name`,
          `k8s.replicaset.name`, `k8s.deployment.name`, `k8s.statefulset.name`,
          `k8s.daemonset.name`, `k8s.cronjob.name` and `k8s.job.name`.
        - When `service.name` is missing or empty, `service_name` comes from the
          first indexed attribute whose normalized name is one of `service`, `app`,
          `application`, `app_name`, `name`, `app_kubernetes_io_name`,
          `container`, `container_name`, `k8s_container_name`, `component`,
          `workload`, `job` or `k8s_job_name`; otherwise it is `unknown_service`.
        - Every other resource attribute and every scope and log record attribute
          becomes structured metadata. Map values are flattened with `_`-joined
          names. Log record fields add `severity_number`, `severity_text`,
          `observed_timestamp` (only when both timestamps are set),
          `dropped_attributes_count`, `flags`, `trace_id` and `span_id` (hex), and
          the scope adds `scope_name`, `scope_version` and
          `scope_dropped_attributes_count`, each only when set.
        - Attribute names are normalized like Prometheus `otlptranslator`: every
          character outside `[A-Za-z0-9]` becomes `_`, runs of `_` collapse, a
          leading digit gets the prefix `key_`, and `__x__` keeps its double
          underscores. An empty name, or one that normalizes to only underscores,
          returns 400.
        - The log line is the record body rendered as a string. The entry
          timestamp is `timeUnixNano`, else `observedTimeUnixNano`, else the time
          the server received the request.

        **Response.** Success is 204 with an empty body. The server does not
        return an `ExportLogsServiceResponse` and never reports partial success:
        a request is stored entirely or rejected entirely. An export with no log
        records (for example `{}`) is answered with 204 and nothing is stored.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: Content-Encoding
          in: header
          required: false
          description: Optional body encoding, empty, `identity` or `gzip`. Any other value returns 400.
          schema:
            type: string
            enum: [identity, gzip]
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              $ref: '#/components/schemas/OTLPExportLogsRequestProtobuf'
          application/json:
            schema:
              $ref: '#/components/schemas/OTLPExportLogsRequestJSON'
            example:
              resourceLogs:
                - resource:
                    attributes:
                      - key: service.name
                        value: {stringValue: checkout}
                      - key: host.name
                        value: {stringValue: web-1.example.com}
                  scopeLogs:
                    - scope: {name: example-logger, version: "1.0.0"}
                      logRecords:
                        - timeUnixNano: "1700000000000000000"
                          severityNumber: 9
                          severityText: INFO
                          body: {stringValue: "order placed"}
                          attributes:
                            - key: client.address
                              value: {stringValue: 203.0.113.10}
      responses:
        '204':
          description: The export was accepted and reached the acknowledgment point, or it held no log records. The body is empty.
        '400':
          $ref: '#/components/responses/LokiError'
          description: |
            The request was rejected and nothing was stored. Causes: missing,
            unparseable or unsupported `Content-Type`; unsupported
            `Content-Encoding`; a body or gzip expansion larger than
            `-ingest.max-request-size`; an error while reading the body; malformed
            gzip, protobuf or OTLP JSON data; an attribute name that is empty or
            normalizes to only underscores; a line longer than
            `-ingest.max-line-size`; an ingest pipeline that rejected the data; or
            a pipeline result that fails validation.
        '401':
          $ref: '#/components/responses/LokiError'
          description: The `X-Scope-OrgID` header could not be resolved to a tenant (written with `http.Error`, same plain-text format).
        '429':
          $ref: '#/components/responses/Backpressure'
        '500':
          $ref: '#/components/responses/LokiError'
          description: |
            A server fault. The body is `ingest: push transform failed` or
            `ingest: failed to persist push`, as for the Loki push endpoint.
        '501':
          $ref: '#/components/responses/LokiError'
          description: This process does not run the ingester role, so the route is a placeholder.
        '503':
          $ref: '#/components/responses/LokiError'
          description: |
            The ingester is replaying its WAL, shutting down or stopped after a
            fatal error. The body is `ingest: not accepting pushes`.

  /loki/api/v1/tail:
    get:
      operationId: tailLogs
      summary: Stream new log entries over a WebSocket
      tags: [Tail]
      description: |
        Opens a live tail. The querier validates the request, then upgrades the
        connection to a WebSocket (RFC 6455, version 13) and sends entries that
        match the LogQL log query as they are pushed. The request must carry the
        WebSocket handshake headers (`Connection: Upgrade`, `Upgrade: websocket`,
        `Sec-WebSocket-Version: 13` and a `Sec-WebSocket-Key`). Every origin is
        accepted, as in Loki.

        **What is streamed.** Only entries acknowledged by an ingester after the
        subscription started are sent. There is no historical backfill: `start`
        only filters incoming entries. The querier subscribes to every ingester in
        `-tail.ingester-urls`, or to this process over loopback when it also runs
        the ingester role, and runs the query's full LogQL pipeline on each entry.

        **Messages.** Each server message is a text frame holding one
        `TailFrame` JSON object (see `x-websocket-message`). A frame holds at most
        `limit` entries and at most 4 MiB of JSON; larger batches are split into
        several frames and the connection stays open. Timestamps are Unix
        nanosecond strings with microsecond precision. Without the
        `categorize-labels` flag, structured metadata and parsed labels are merged
        into each stream's labels (parsed labels win over metadata, which wins
        over stream labels). With the flag, each value is a three-element tuple
        and those labels are removed from `stream`.

        **Loss and close codes.** The server pings the client every second and
        drops the connection when a ping is not answered within 5 seconds or a
        write blocks for 10 seconds. When the querier's per-connection buffer
        (`-tail.buffer-entries`, default 1024) overflows, the lost entries are
        described in `dropped_entries`. The server closes the WebSocket with:

        - 1011 (internal error) when an ingester fails, returns an HTTP error,
          breaks the wire protocol, drops entries for a slow subscriber or closes
          its stream; when not every ingester acknowledges the subscription
          within 10 seconds; when one entry does not fit in a 4 MiB frame; when
          more than 1000 dropped entries are waiting to be described; or when a
          write fails. The close reason (at most 123 bytes) says which.
        - 1001 (going away) when the service shuts down.

        When the client goes away the server closes without a close frame.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: query
          in: query
          required: true
          description: A LogQL log query, for example `{job="api"} |= "error"`. Metric queries return 400.
          schema:
            type: string
          example: '{job="api"} |= "error"'
        - name: limit
          in: query
          required: false
          description: |
            Most entries in one WebSocket message. It must be a positive integer no
            larger than `-logql.max-entries` (default 5000). It does not end the
            stream.
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: delay_for
          in: query
          required: false
          description: |
            Whole seconds to hold each entry back after its timestamp, so entries
            from several ingesters can be sent in timestamp order.
          schema:
            type: integer
            minimum: 0
            maximum: 5
            default: 0
        - name: start
          in: query
          required: false
          description: |
            Drop incoming entries older than this time. Accepts Unix seconds with a
            decimal fraction (rounded to milliseconds), an integer of up to 10
            digits (Unix seconds), a longer integer (Unix nanoseconds) or RFC 3339.
            When absent, nothing is filtered.
          schema:
            type: string
          example: '1700000000'
        - name: X-Loki-Response-Encoding-Flags
          in: header
          required: false
          description: |
            Comma-separated flags. `categorize-labels` keeps structured metadata and
            parsed labels apart in a third tuple element instead of merging them
            into the stream labels.
          schema:
            type: string
          example: categorize-labels
      responses:
        '101':
          description: |
            The connection switched to the WebSocket protocol. The server then sends
            `TailFrame` messages as text frames until one side closes.
          headers:
            Upgrade:
              schema: {type: string, const: websocket}
            Connection:
              schema: {type: string, const: Upgrade}
            Sec-WebSocket-Accept:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/LokiError'
          description: |
            The request was rejected before the upgrade. Causes, written by Parkana:
            a query string that cannot be parsed (`invalid query parameters`);
            `query`, `limit`, `delay_for` or `start` given more than once; missing
            or blank `query`; `limit` not an integer or not positive; `limit`
            above `-logql.max-entries`; `delay_for` not an integer, negative or
            above 5; an invalid `start`; a LogQL parse error or a metric query.
            Causes written by the WebSocket library after validation passed, with
            `http.Error` (same plain-text format): `Sec-WebSocket-Version` is not
            `13`, or `Sec-WebSocket-Key` is missing, repeated or not a 16-byte
            base64 value.
        '401':
          $ref: '#/components/responses/LokiError'
          description: The `X-Scope-OrgID` header could not be resolved to a tenant (written with `http.Error`, same plain-text format).
        '405':
          description: |
            The method is not GET. Methods other than GET and HEAD are refused by
            the router. A HEAD request with valid parameters and the `Connection`
            and `Upgrade` handshake headers is refused by the WebSocket library
            (without those headers it gets 426). Both write a plain-text body.
          content:
            text/plain; charset=utf-8:
              schema: {type: string}
        '426':
          description: |
            The parameters are valid but the request is not a WebSocket handshake:
            `Connection` does not contain `Upgrade`, `Upgrade` does not contain
            `websocket`, or the request uses HTTP/1.0. Written by the WebSocket
            library with `http.Error`; the response carries `Connection: Upgrade`
            and `Upgrade: websocket` (except for the HTTP/1.0 case).
          headers:
            Upgrade:
              schema: {type: string, const: websocket}
          content:
            text/plain; charset=utf-8:
              schema: {type: string}
              example: "WebSocket protocol violation: Connection header \"\" does not contain Upgrade\n"
        '501':
          $ref: '#/components/responses/LokiError'
          description: This process does not run the querier role, so the route is a placeholder.
        '503':
          $ref: '#/components/responses/LokiError'
          description: |
            Live tail is unavailable: the querier has no ingester URLs (querier-only
            process without `-tail.ingester-urls`), or the service is shutting down.
      x-websocket-message:
        $ref: '#/components/schemas/TailFrame'

  /internal/ingest/tail:
    get:
      operationId: ingesterTailSubscribe
      summary: Subscribe to an ingester's live entries
      tags: [Internal]
      x-internal: true
      description: |
        The ingester side of live tail. A querier calls this route to receive every
        entry the ingester acknowledges for the tenant from now on; the querier
        then applies the LogQL query. It is part of the private protocol between
        roles and is not a Loki endpoint. It takes no query parameters and has no
        authentication beyond the tenant header, so do not expose it to clients.

        The response is a stream of newline-delimited JSON (`application/x-ndjson`),
        one `IngesterTailRecord` per line, flushed as each record is written:

        1. The first record is always `ready`, with the tenant and the
           subscriber's entry budget (`-tail.buffer-entries`, default 1024). It is
           sent even while the ingester replays its WAL; the stream then stays
           empty until the first acknowledged push.
        2. `batch` records carry the entries of acknowledged pushes in push order.
           Timestamps are Unix nanosecond strings truncated to microseconds.
           Labels and metadata are sorted by name. Replayed WAL records are
           never sent.
        3. When queued entries would exceed the budget, the subscriber is evicted:
           the server writes one `dropped` record with the count of lost entries
           and reason `slow subscriber`, then ends the response.

        The response also ends when the client disconnects, when the ingester
        shuts down, or when one write blocks for more than 10 seconds.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200':
          description: The subscription is open. The body is an NDJSON stream of records.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/IngesterTailRecord'
              example: |
                {"type":"ready","tenant":"default","bufferEntries":1024}
                {"type":"batch","entries":[{"timestamp":"1700000000000000000","line":"GET /index.html 200","labels":[{"name":"host","value":"web-1.example.com"},{"name":"job","value":"api"}]}]}
                {"type":"dropped","dropped":1500,"reason":"slow subscriber"}
        '401':
          $ref: '#/components/responses/LokiError'
          description: The `X-Scope-OrgID` header could not be resolved to a tenant (written with `http.Error`, same plain-text format).
        '404':
          description: This process does not run the ingester role. The route is not registered, so the router answers with its default plain-text 404.
          content:
            text/plain; charset=utf-8:
              schema: {type: string}
        '405':
          description: The method is not GET or HEAD. The router answers with a plain-text 405.
          content:
            text/plain; charset=utf-8:
              schema: {type: string}


  /loki/api/v1/query:
    get:
      operationId: queryInstant
      tags: [Query]
      summary: Run an instant LogQL query
      description: >-
        Evaluates a LogQL metric or scalar expression at a single point in
        time. A metric expression returns a vector and a scalar expression
        returns a scalar. A log query (a stream selector with an optional
        pipeline) is rejected with 400, because log queries cannot be instant
        queries; use `/loki/api/v1/query_range` for them. Parameters that only
        range queries use (start, end, since, step, interval) are ignored.
        Read pipelines, when configured, apply to this endpoint. Only data in
        uploaded Parquet files is visible; lines still held by the ingester
        are not returned.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/QEncodingFlagsHeader'
        - $ref: '#/components/parameters/QQuery'
        - $ref: '#/components/parameters/QTime'
        - $ref: '#/components/parameters/QLimit'
        - $ref: '#/components/parameters/QDirection'
      responses:
        '200':
          $ref: '#/components/responses/QQueryOK'
        '400':
          $ref: '#/components/responses/LokiError'
          description: >-
            The request parameters do not parse, the query is empty, the
            LogQL does not parse, the query is a log query, the LogQL uses a
            feature Parkana does not support, or a metric query returns more
            series than the configured maximum (`-logql.max-series`, default
            500).
        '401':
          $ref: '#/components/responses/LokiError'
          description: The X-Scope-OrgID header names an invalid or disallowed tenant.
        '499':
          $ref: '#/components/responses/QClientClosed'
        '500':
          $ref: '#/components/responses/LokiError'
          description: The query failed on the server, or the result could not be encoded.
        '501':
          $ref: '#/components/responses/LokiError'
          description: This process does not run the querier role.
        '503':
          $ref: '#/components/responses/QShuttingDown'
        '504':
          $ref: '#/components/responses/QTimeout'
    post:
      operationId: queryInstantPost
      tags: [Query]
      summary: Run an instant LogQL query with a form body
      description: >-
        Same as `GET /loki/api/v1/query`, with the parameters sent as an
        `application/x-www-form-urlencoded` body. Parameters in the URL query
        string are accepted too; when a name appears in both, the body value
        wins. A body with any other content type is not read, so only the
        query string counts. The body is limited to 10 MiB.
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - $ref: '#/components/parameters/QEncodingFlagsHeader'
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QInstantQueryForm'
      responses:
        '200':
          $ref: '#/components/responses/QQueryOK'
        '400':
          $ref: '#/components/responses/LokiError'
          description: >-
            The form body or a parameter does not parse, the query is empty,
            the LogQL does not parse, the query is a log query, the LogQL uses
            a feature Parkana does not support, or a metric query returns more
            series than the configured maximum.
        '401':
          $ref: '#/components/responses/LokiError'
          description: The X-Scope-OrgID header names an invalid or disallowed tenant.
        '499':
          $ref: '#/components/responses/QClientClosed'
        '500':
          $ref: '#/components/responses/LokiError'
          description: The query failed on the server, or the result could not be encoded.
        '501':
          $ref: '#/components/responses/LokiError'
          description: This process does not run the querier role.
        '503':
          $ref: '#/components/responses/QShuttingDown'
        '504':
          $ref: '#/components/responses/QTimeout'

  /loki/api/v1/query_range:
    get:
      operationId: queryRange
      tags: [Query]
      summary: Run a LogQL query over a time range
      description: >-
        Runs a LogQL log query or metric query over a time range. A log query
        returns streams of entries with timestamps in [start, end), at most
        `limit` entries in total, ordered by `direction`. A metric query
        returns a matrix with one point per step; `limit` does not apply to
        it, and the engine aligns start and end to the step grid. A scalar
        expression returns one matrix series without labels. Read pipelines,
        when configured, apply to this endpoint. Only data in uploaded
        Parquet files is visible.
