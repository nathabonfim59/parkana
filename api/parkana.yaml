    get:
      operationId: indexVolume
      tags: [Metadata]
      summary: Sum line bytes per group over a range
      description: >-
        Returns the total line bytes over [start, end] for each group of
        streams that match the required `query` selector, as a vector. A bare
        `{}` selects every stream. With `aggregateBy=series` (the default) a
        group is a label set projected onto the selector's label names, or
        onto `targetLabels` when given. With `aggregateBy=labels` a group is
